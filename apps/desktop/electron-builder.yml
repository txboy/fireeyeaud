appId: com.fireeyeaud.app
productName: fireeyeaud
directories:
  output: release
files:
  - src/**/*
  - package.json
# 生产环境 sidecar（PyInstaller 产物）通过 extraResources 注入，Phase 6 接入：
# extraResources:
#   - from: ../../dist/sidecar
#     to: sidecar
win:
  target:
    - nsis
  icon: build/icon.ico
mac:
  target:
    - dmg
  icon: build/icon.png
linux:
  target:
    - AppImage
  icon: build/icon.png
