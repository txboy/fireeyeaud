name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v5

      - name: Build sidecar (PyInstaller)
        working-directory: services/agent
        run: |
          uv sync --dev
          uv run pyinstaller fireeyeaud-agent.spec --noconfirm --clean

      - name: Smoke-test sidecar
        working-directory: services/agent/dist
        shell: pwsh
        run: |
          $env:FIREYEAUD_PORT = '18765'
          $out = Join-Path $env:RUNNER_TEMP 'sidecar.out.log'
          $err = Join-Path $env:RUNNER_TEMP 'sidecar.err.log'

          # 首次运行要解压 100+MB 到临时目录，Runner 上的 Defender 还会扫描一遍，
          # 冷启动远慢于开发机，给足 180 秒。
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process -FilePath .\fireeyeaud-agent.exe -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $out -RedirectStandardError $err

          $ok = $false
          while ($sw.Elapsed.TotalSeconds -lt 180) {
            if ($proc.HasExited) { break }
            try {
              $r = Invoke-RestMethod "http://127.0.0.1:18765/api/v1/health" -TimeoutSec 2
              if ($r.status -eq 'ok') { $ok = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }

          try {
            if ($ok) {
              Write-Host "sidecar 就绪，耗时 $([math]::Round($sw.Elapsed.TotalSeconds,1)) 秒：$($r | ConvertTo-Json -Compress)"
            } else {
              Write-Host "::group::sidecar stderr"
              Get-Content $err -ErrorAction SilentlyContinue | Select-Object -Last 60
              Write-Host "::endgroup::"
              Write-Host "::group::sidecar stdout"
              Get-Content $out -ErrorAction SilentlyContinue | Select-Object -Last 60
              Write-Host "::endgroup::"
              if ($proc.HasExited) {
                throw "sidecar 进程已退出（exit code $($proc.ExitCode)），耗时 $([math]::Round($sw.Elapsed.TotalSeconds,1)) 秒"
              }
              throw "sidecar 未在 180 秒内就绪"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Process fireeyeaud-agent -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        shell: pwsh
        run: |
          # npm registry 偶发 ECONNRESET（网络重置），一次失败不代表依赖有问题。
          # 重试 3 次，并调高 npm 自身对单次请求的重试次数与超时。
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            Write-Host "npm ci 尝试 $i/$max"
            npm ci --no-audit --no-fund --prefer-offline `
              --fetch-retries 5 `
              --fetch-retry-mintimeout 20000 `
              --fetch-retry-maxtimeout 120000 `
              --fetch-timeout 600000
            if ($LASTEXITCODE -eq 0) {
              Write-Host "npm ci 成功（第 $i 次尝试）"
              exit 0
            }
            Write-Host "npm ci 第 $i 次失败（exit $LASTEXITCODE）"
            if ($i -lt $max) {
              Write-Host '清理 node_modules 后重试'
              cmd /c "if exist node_modules rd /s /q node_modules"
              Start-Sleep -Seconds 10
            }
          }
          throw "npm ci 连续失败 $max 次，请检查网络或 registry"

      - name: Build renderer
        run: npm run renderer:build

      # 安装包装完要包含前端与 sidecar，缺任何一样都是「装上打不开」，这里先卡住。
      - name: Check packaging inputs
        shell: pwsh
        run: |
          $need = @(
            'services/agent/dist/fireeyeaud-agent.exe',
            'apps/renderer/dist/index.html',
            'apps/desktop/build/icon.ico'
          )
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "缺少打包输入: $($missing -join ', ')" }

      - name: Package app (electron-builder, unsigned)
        working-directory: apps/desktop
        run: npx electron-builder --win --publish never

      # 出包后核对产物：前端和 sidecar 必须真的在安装目录里，否则就是空壳包。
      - name: Verify packaged output
        shell: pwsh
        run: |
          $root = 'apps/desktop/release/win-unpacked/resources'
          $need = @(
            "$root/renderer/index.html",
            "$root/agent/fireeyeaud-agent.exe",
            "$root/app.asar"
          )
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "安装包缺文件: $($missing -join ', ')" }

      - uses: actions/upload-artifact@v4
        with:
          name: fireeyeaud-windows
          path: apps/desktop/release/**
          if-no-files-found: error
