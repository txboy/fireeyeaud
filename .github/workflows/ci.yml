name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    # 与开发机一致：pyodbc / access-parser 在 Windows 上最稳。
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck renderer
        run: npm run renderer:typecheck

      - name: Test renderer
        run: npm run test -w @fireeyeaud/renderer

      - name: Test desktop
        run: npm run desktop:test

      - name: Build renderer
        run: npm run renderer:build
