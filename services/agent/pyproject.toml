[project]
name = "fireeyeaud-agent"
version = "0.0.0"
description = "火眼审计助手 Agent sidecar（FastAPI + LangGraph）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sse-starlette",
  "pydantic",
  "pydantic-settings",
  "langgraph",
  "langchain-core",
  "langchain-openai",
  "langgraph-checkpoint-sqlite",
  "duckdb",
  "pandas",
  "openpyxl",
  "openai",
  "python-docx>=1.2.0",
  "reportlab>=5.0.1",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fireeyeaud_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
