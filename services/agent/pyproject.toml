[project]
name = "fireeyeaud-agent"
version = "0.0.0"
description = "火眼审计助手 Agent sidecar（FastAPI + LangGraph）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sse-starlette",
  "pydantic",
  "pydantic-settings",
  "langgraph",
  "langchain-core",
  "langchain-openai",
  "langgraph-checkpoint-sqlite",
  "duckdb",
  "pandas",
  "openpyxl",
  "pypdf>=5.0.0",
  "pymupdf>=1.24.0",
  "Pillow>=10.0.0",
  "openai",
  "python-docx>=1.2.0",
  "reportlab>=5.0.1",
  "sqlalchemy>=2.1.4",
  "sqlglot>=30.22.0",
  "psycopg[binary]>=3.3.6",
  "pymysql>=1.2.3",
  "pyodbc>=5.3.0",
  "sqlalchemy-access>=2.0.3",
  "oracledb>=2.5.0",
  "httpx>=0.28.1",
  "access-parser>=0.0.6",
  "mcp>=2.0.0",
  "docxtpl>=0.20.2",
  "dulwich>=1.2.17",
  "merge3>=0.0.16",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "pyinstaller>=6.22.3",
  "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fireeyeaud_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# 只开「真问题」规则：pyflakes + 语法级错误 + bugbear 里高置信度的几条。
# 刻意不含：
#   I001（import 排序）——纯格式，动 100+ 文件会淹没真实 diff；
#   SIM  ——部分规则（如 try/except/pass → suppress）会把刻意的兜底改写得更难读；
#   UP   ——版本现代化，与本次「清理」无关，单独排期。
select = [
  "F",        # pyflakes：未使用导入 / 未定义名字 / 未使用变量 / f-string 问题
  "E9",       # 语法级错误
  "B017",     # assertRaises(Exception) 掩盖真实失败
  "B018",     # 无意义的表达式语句
  "B023",     # 循环内闭包捕获循环变量
  "B904",     # except 里 raise 没 from
  "RUF100",   # 失效的 noqa（避免误导后来人）
]

[tool.ruff.lint.per-file-ignores]
# 测试里断言异常本身就需要 broad except。
"tests/**" = ["B017"]
